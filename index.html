<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ParMind Golf</title>

<style>
/* Layout: persistent sidebar on desktop, bottom tab bar on phones; one calm content column with quiet cards and a single muted fairway-green accent. */
:root{
  --bg:#F3F3F0; --surface:#FFFFFF; --surface-2:#ECECE8; --line:#DCDCD6;
  --fg:#1D1F1C; --muted:#656961; --faint:#8D9088;
  --accent:#2E5B4C; --accent-fg:#FFFFFF; --accent-soft:#E0EAE5;
  --good:#2A7650; --good-soft:#DDECE3;
  --warn:#8A5F1E; --warn-soft:#F3E8D2;
  --bad:#A4453C; --bad-soft:#F4E0DD;
  --overlay:rgba(24,26,22,.45);
  --f-display:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141614; --surface:#1C1F1C; --surface-2:#252925; --line:#2E332E;
    --fg:#ECEDE9; --muted:#9A9E96; --faint:#767A72;
    --accent:#86BBA4; --accent-fg:#0F211A; --accent-soft:#223229;
    --good:#7CC39A; --good-soft:#1F3328;
    --warn:#D8AE6A; --warn-soft:#38301E;
    --bad:#E08A80; --bad-soft:#3A2321;
    --overlay:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141614; --surface:#1C1F1C; --surface-2:#252925; --line:#2E332E;
  --fg:#ECEDE9; --muted:#9A9E96; --faint:#767A72;
  --accent:#86BBA4; --accent-fg:#0F211A; --accent-soft:#223229;
  --good:#7CC39A; --good-soft:#1F3328;
  --warn:#D8AE6A; --warn-soft:#38301E;
  --bad:#E08A80; --bad-soft:#3A2321;
  --overlay:rgba(0,0,0,.6);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg);
  font:15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.frame{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:48px;padding-block:28px 48px}
.main{min-width:0;display:flex;flex-direction:column;gap:24px}

/* Sidebar */
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 28px);align-self:start;display:flex;flex-direction:column;gap:24px;min-width:0}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.mark svg.i{width:21px;height:21px;stroke-width:2}
.brand b{font:700 19px/1.1 var(--f-display);letter-spacing:-.01em;display:block}
.brand small{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;background:none;border-radius:10px;color:var(--muted);text-align:left;font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.sidecard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.stat{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font:500 15px var(--f-mono)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.sideactions{display:flex;flex-direction:column;gap:8px}

/* Mobile top + tab bar */
.top{display:none}
.tabbar{display:none}

/* Page header */
.ph{display:flex;flex-direction:column;gap:8px;max-width:62ch}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font:700 30px/1.12 var(--f-display);letter-spacing:-.02em}
.lede{color:var(--muted)}
.phrow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h2{font:650 18px/1.25 var(--f-display);letter-spacing:-.01em}
h3{font:650 15px/1.3 var(--f-display)}
.sub{font-size:13px;color:var(--muted)}
.label{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* Cards, pills, buttons */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0}
.card.flat{background:transparent}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.cols{display:grid;gap:24px;min-width:0}
.cols.c2-1{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.cols.c1-1{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.iconbtn{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;border:0;background:none;color:var(--faint)}
.iconbtn:hover{background:var(--surface-2);color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font:500 13px var(--f-mono)}
.chip svg.i{width:15px;height:15px;color:var(--accent)}

/* Goal card */
.goal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.goalnum{display:flex;align-items:baseline;gap:10px;font-family:var(--f-display)}
.goalnum b{font-size:44px;line-height:1;font-weight:700;letter-spacing:-.03em}
.goalnum i{font-style:normal;color:var(--faint);font-size:24px}
.sliders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.sliders label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.sliders label b{color:var(--fg);font-family:var(--f-mono);font-weight:500}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}

/* Trap lab */
.scenario{font:500 19px/1.45 var(--f-display);letter-spacing:-.01em;max-width:60ch}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);background:var(--bg);border-radius:12px;color:var(--fg);transition:border-color .15s,background .15s}
.opt:not(:disabled):hover{border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt .key{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font:500 12px var(--f-mono)}
.opt .t{flex:1;min-width:0;padding-top:2px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.right svg.i{color:var(--good)}
.opt.wrong svg.i{color:var(--bad)}
.opt.dim{opacity:.6}
.fb{border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.fb.good{background:var(--good-soft)}
.fb.warn{background:var(--warn-soft)}
.fb b{display:flex;align-items:center;gap:8px}
.fb.good b{color:var(--good)}
.fb.warn b{color:var(--warn)}
.fb .cue{padding-top:10px;border-top:1px solid color-mix(in srgb,currentColor 18%,transparent);font-style:italic}
.cardfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px}
.steps li{display:flex;gap:10px}
.steps li span{font:500 12px/1.9 var(--f-mono);color:var(--accent)}

/* Roadmap */
.road{display:flex;flex-direction:column;gap:8px}
.rstep{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);background:var(--surface);border-radius:12px}
.rstep:hover{border-color:var(--faint)}
.rstep[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.rico{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--faint)}
.rico.done{background:var(--good-soft);color:var(--good)}
.rico.now{background:var(--accent-soft);color:var(--accent)}
.rstep .rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rstep .rt small{font:500 11.5px var(--f-mono);color:var(--faint)}
.rstep .rt b{font-weight:600;font-size:14.5px}
.detail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 28px);align-self:start;display:flex;flex-direction:column;gap:18px}
.checks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--muted)}
.checks li{display:flex;gap:10px}
.checks svg.i{color:var(--accent);margin-top:2px;width:16px;height:16px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding-top:12px;border-top:1px solid var(--line)}
.kv b{font-weight:600;text-align:right}

/* Planner */
.sess{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:20px;align-items:center}
.date{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0;border-radius:12px;background:var(--surface-2);line-height:1.1}
.date small{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.date b{font:700 26px var(--f-display)}
.date span{font:500 11px var(--f-mono);color:var(--muted)}
.sessbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.sessbody .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 24px;font-size:13px;color:var(--muted)}
.meta b{color:var(--fg);font-weight:600}
.acts{display:flex;align-items:center;gap:6px}
.empty{padding:44px 20px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}

/* Log */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile span{font-size:12px;color:var(--muted)}
.tile b{font:700 26px/1.2 var(--f-display);letter-spacing:-.02em}
.alloc{display:flex;flex-direction:column;gap:14px}
.alloc .r{display:grid;grid-template-columns:110px minmax(0,1fr) 110px;gap:14px;align-items:center;font-size:13px}
.alloc .r span:last-child{text-align:right;color:var(--muted);font-family:var(--f-mono);font-size:12px}
.alloc .bar{height:8px}
.logs{display:flex;flex-direction:column;gap:12px}
.log{display:flex;flex-direction:column;gap:12px}
.loghead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.loghead .m{display:flex;gap:14px;font:12px var(--f-mono);color:var(--muted)}
.logbody{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;font-size:14px}
.logbody p:first-child{font-size:12px;color:var(--muted);margin-bottom:2px}
.logfoot{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);padding-top:10px;border-top:1px solid var(--line)}
.dots{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line)}
.dots i.on{background:var(--accent);border-color:var(--accent)}

/* Mind */
.breath{display:flex;flex-direction:column;gap:16px}
.orbwrap{display:grid;place-items:center;height:210px;background:var(--bg);border-radius:12px;position:relative;overflow:hidden}
.ring{position:absolute;width:150px;height:150px;border-radius:50%;border:1px dashed var(--line)}
.orb{width:150px;height:150px;border-radius:50%;background:var(--accent-soft);border:2px solid var(--accent);display:grid;place-items:center;transform:scale(.6);transition:transform 4s linear}
.orb[data-p="in"],.orb[data-p="full"]{transform:scale(1)}
.orb[data-p="idle"]{transform:scale(.72);transition-duration:.4s}
.orb span{font:600 14px var(--f-display);color:var(--accent);text-align:center}
.reframe{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.quote{border-radius:12px;padding:14px 16px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.quote.b{background:var(--bad-soft)}
.quote.g{background:var(--good-soft)}
.quote .label{color:inherit;opacity:.85}
.quote.b .label{color:var(--bad)}
.quote.g .label{color:var(--good)}
.quote p{font-style:italic}
.mhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:12px var(--f-mono);color:var(--muted)}
.mhead b{color:var(--fg);font-weight:500}

/* Coaching */
.plan{display:flex;flex-direction:column;gap:18px;justify-content:space-between}
.plan.hi{border:2px solid var(--accent)}
.price{font:700 36px/1 var(--f-display);letter-spacing:-.03em}
.price small{font:400 13px var(--f-body);color:var(--muted);letter-spacing:0;margin-left:4px}
.plan .top2{display:flex;flex-direction:column;gap:12px}

/* Modal + toast */
.overlay{position:fixed;inset:0;z-index:50;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:480px;padding:24px;display:flex;flex-direction:column;gap:16px;max-height:100%;overflow-y:auto}
.modal.sm{max-width:400px}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.form{display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:12.5px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.fld textarea{resize:vertical;min-height:70px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.mf{display:flex;gap:10px;justify-content:flex-end;padding-top:4px}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:12px 0}
.done .mark{width:52px;height:52px;border-radius:50%;background:var(--good-soft);color:var(--good)}
#toast{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;justify-content:center;z-index:60;pointer-events:none;padding-inline:16px}
.toast{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13.5px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.2)}

.foot{font-size:12.5px;color:var(--faint);padding-top:8px}

/* Responsive */
@media (max-width:1000px){
  .cols.c2-1,.cols.c3{grid-template-columns:minmax(0,1fr)}
  .detail{position:static}
  .goal{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .frame{grid-template-columns:minmax(0,1fr);gap:20px;padding-block:16px calc(84px + env(safe-area-inset-bottom,0px))}
  .side{display:none}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .top .brand b{font-size:17px}
  .top .brand small{display:none}
  .top .chips{display:flex;gap:6px}
  .tabbar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--faint);font-size:11px;font-weight:600;padding:6px 0;border-radius:10px;min-width:0}
  .tabbar button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
  h1{font-size:25px}
}
@media (max-width:640px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sliders,.reframe,.logbody,.cols.c1-1,.meta{grid-template-columns:minmax(0,1fr)}
  .sess{grid-template-columns:56px minmax(0,1fr)}
  .sess .acts{grid-column:1 / -1;justify-content:flex-end}
  .alloc .r{grid-template-columns:84px minmax(0,1fr);}
  .alloc .r span:last-child{grid-column:1 / -1;text-align:left;margin-top:-8px}
  .card{padding:18px}
  .row3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .goalnum b{font-size:38px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>

/* ---------- Helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function pd(s){var p=String(s).split('-').map(Number);var d=new Date(p[0],(p[1]||1)-1,p[2]||1);return isNaN(d)?new Date():d;}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtShort(s){var d=pd(s);return DOW[d.getDay()]+', '+MON[d.getMonth()]+' '+d.getDate();}
function bucket(c){c=String(c).toLowerCase();if(c.indexOf('putt')>-1)return 'Putting';if(c.indexOf('short')>-1||c.indexOf('wedge')>-1)return 'Short game';if(c.indexOf('driv')>-1||c.indexOf('range')>-1)return 'Driving range';if(c.indexOf('course')>-1||c.indexOf('match')>-1)return 'Course play';return 'Other';}
function level(){return {n:Math.floor(S.xp/250)+1,pct:(S.xp%250)/250*100,into:S.xp%250};}
function toast(msg){
  var t=$('#toast');var el=document.createElement('div');el.className='toast';el.textContent=msg;t.appendChild(el);
  setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},2400);
}

  '<div class="phrow"><div class="ph"><p class="eyebrow">Practice log</p><h1>What you have put in</h1><p class="lede">Hours, balls and how the session felt. Patterns show up after a week or two.</p></div>'+

    '<div class="tile"><span>Sessions</span><b class="num">'+S.sessions.length+'</b></div>'+

}

/* ---------- Modals ---------- */
function fld(id,label,inner){return '<div class="fld"><label for="'+id+'">'+label+'</label>'+inner+'</div>';}
function mHead(title,id){return '<div class="mh"><h2 id="'+id+'">'+title+'</h2><button class="iconbtn" data-a="closeModal" aria-label="Close" type="button">'+ic('x')+'</button></div>';}

function modalHTML(){
  var m=S.modal;if(!m)return '';
  var body='',cls='modal';
  if(m.type==='session'){
    var pre=null;S.scheduled.forEach(function(s){if(s.id===m.id)pre=s;});
    body=mHead(pre?'Log completed session':'Log practice','mt')+
    '<form class="form" data-form="session">'+
      '<input type="hidden" name="sched" value="'+esc(pre?pre.id:'')+'">'+
      '<div class="row2">'+fld('fDate','Date','<input id="fDate" type="date" name="date" required value="'+esc(pre?pre.date:todayStr())+'">')+
      fld('fCat','Area','<input id="fCat" name="category" required list="cats" value="'+esc(pre?pre.category:'Putting & Gate Drills')+'"><datalist id="cats"><option value="Putting & Gate Drills"><option value="Short Game & Wedges"><option value="Driving Range & Tempo"><option value="Course Play / Match"></datalist>')+'</div>'+
      '<div class="row3">'+fld('fDur','Minutes','<input id="fDur" type="number" name="duration" min="5" required value="'+esc(pre?pre.duration:60)+'">')+
      fld('fBalls','Balls hit','<input id="fBalls" type="number" name="shotsHit" min="0" required value="100">')+
      fld('fFocus','Focus','<select id="fFocus" name="focusLevel"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option></select>')+'</div>'+
      fld('fDrills','Drills','<input id="fDrills" name="drills" required placeholder="e.g. 3-6-9ft gate drill and ladder" value="'+esc(pre?pre.drills:'')+'">')+
      fld('fNotes','Notes and feel','<textarea id="fNotes" name="notes" rows="2" placeholder="What felt clean? What needs attention?"></textarea>')+
      fld('fQual','Quality','<select id="fQual" name="perceivedQuality"><option value="High">High: clean and focused</option><option value="Medium" selected>Medium: some progress</option><option value="Low">Low: disconnected</option></select>')+
      '<div class="mf"><button class="btn" type="button" data-a="closeModal">Cancel</button><button class="btn primary" type="submit">Save log (+10 XP)</button></div>'+
    '</form>';
  } else if(m.type==='schedule'){
    body=mHead('Plan a practice session','mt')+
    '<form class="form" data-form="schedule">'+
      '<div class="row2">'+fld('sDate','Date','<input id="sDate" type="date" name="date" required value="'+todayStr()+'">')+fld('sTime','Time','<input id="sTime" type="time" name="time" required value="09:00">')+'</div>'+
      '<div class="row2">'+fld('sCat','Focus','<input id="sCat" name="category" required placeholder="e.g. Putting speed">')+fld('sDur','Minutes','<input id="sDur" type="number" name="duration" min="15" required value="60">')+'</div>'+
      fld('sDrills','Planned drills','<input id="sDrills" name="drills" required placeholder="e.g. 50-yd wedge towel dispersion">')+
      fld('sInt','Intensity','<select id="sInt" name="intensity"><option value="Low">Low: technical and feel</option><option value="Medium" selected>Medium: standard</option><option value="High">High: high volume</option><option value="Match Pressure">Match pressure: simulated round</option></select>')+
      fld('sGoal','Target benchmark','<input id="sGoal" name="targetGoal" required placeholder="e.g. Make 80% of putts inside 4 ft">')+
      '<div class="mf"><button class="btn" type="button" data-a="closeModal">Cancel</button><button class="btn primary" type="submit">Schedule</button></div>'+
    '</form>';
  } else if(m.type==='mental'){
    body=mHead('Mental check-in','mt')+
    '<form class="form" data-form="mental">'+
      '<div class="row3">'+fld('mMood','Mood (1-5)','<input id="mMood" type="number" name="mood" min="1" max="5" required value="4">')+fld('mStress','Stress (1-5)','<input id="mStress" type="number" name="stress" min="1" max="5" required value="2">')+fld('mConf','Confidence (1-5)','<input id="mConf" type="number" name="confidence" min="1" max="5" required value="4">')+'</div>'+
      fld('mFrus','What frustrated you on course?','<textarea id="mFrus" name="frustration" rows="2" required placeholder="e.g. 3-putted #14 after a great drive"></textarea>')+
      fld('mRef','Process reframe','<textarea id="mRef" name="reframed" rows="2" required placeholder="e.g. Speed was good. I over-read the break."></textarea>')+
      '<div class="mf"><button class="btn" type="button" data-a="closeModal">Cancel</button><button class="btn primary" type="submit">Save (+10 XP)</button></div>'+
    '</form>';
  } else if(m.type==='booking'){
    if(m.done){
      cls='modal sm';
      body='<div class="done"><div class="mark">'+ic('check')+'</div><h2 id="mt">Request saved</h2><p class="sub" style="font-size:14px">This page has no booking service behind it, so nothing was sent and no coach has been notified. Share your details with a coach directly to book.</p><button class="btn primary" data-a="closeModal">Close</button></div>';
    } else {
      body=mHead('Book a free strategy call','mt')+
      '<p class="sub">Review your baseline handicap and mental game routine with a coach.</p>'+
      '<form class="form" data-form="booking">'+
        fld('bName','Name','<input id="bName" required placeholder="Alex Morgan" autocomplete="name">')+
        '<div class="row2">'+fld('bMail','Email','<input id="bMail" type="email" required placeholder="alex@example.com" autocomplete="email">')+fld('bTel','Phone','<input id="bTel" type="tel" required placeholder="(555) 000-0000" autocomplete="tel">')+'</div>'+
        '<div class="row2">'+fld('bH','Current handicap','<input id="bH" type="number" step="0.1" value="'+S.hcp+'">')+fld('bT','Target handicap','<input id="bT" type="number" step="0.1" value="'+S.target+'">')+'</div>'+
        '<div class="mf"><button class="btn" type="button" data-a="closeModal">Cancel</button><button class="btn primary" type="submit">Request call</button></div>'+
      '</form>';
    }
  } else if(m.type==='reset'){
    cls='modal sm';
    body=mHead('Reset sample data?','mt')+'<p class="sub" style="font-size:14px">This replaces your practice logs, plans, check-ins, XP and streak with the original sample data.</p>'+
      '<div class="mf"><button class="btn" data-a="closeModal">Cancel</button><button class="btn danger" data-a="doReset">Reset</button></div>';
  }
  return '<div class="overlay" data-a="overlay"><div class="'+cls+'" role="dialog" aria-modal="true" aria-labelledby="mt">'+body+'</div></div>';
}

function openModal(type,id){
  S.modal={type:type,id:id,done:false};
  paintModal();
}
function paintModal(){
  $('#modal').innerHTML=modalHTML();
  document.body.classList.toggle('noscroll',!!S.modal);
  if(S.modal){var f=$('#modal input:not([type=hidden]),#modal textarea,#modal select,#modal button');if(f)f.focus();}
}
function closeModal(){S.modal=null;paintModal();}

/* ---------- Rendering ---------- */
var bTimer=null,bIdx=0;
var PH=[['in','Inhale'],['full','Hold'],['out','Exhale'],['empty','Hold']];
function breathUI(){
  var o=$('#orb'),l=$('#orbLabel');if(!o||!l)return;
  if(!S.breathing){o.setAttribute('data-p','idle');l.textContent='Ready';return;}
  o.setAttribute('data-p',PH[bIdx][0]);l.textContent=PH[bIdx][1]+' · 4s';
}
function stopBreath(){S.breathing=false;if(bTimer){clearInterval(bTimer);bTimer=null;}}
function render(){
  $('#app').innerHTML=shell();
  breathUI();
}
function go(tab){
  if(tab!==S.tab){stopBreath();S.tab=tab;}
  if(location.hash!=='#'+tab){try{location.hash=tab;}catch(e){}}
  render();window.scrollTo(0,0);
}

/* ---------- Events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.dataset.a;
  switch(a){
    case 'tab':go(el.dataset.v);break;
    case 'pick':{
      var t=TRAPS[S.trapIdx];S.sel=el.dataset.id;
      var o=t.options.filter(function(x){return x.id===S.sel;})[0];
      if(o&&o.ok&&!S.solved[t.id]){S.solved[t.id]=true;S.xp+=10;persist();}
      render();break;}
    case 'next':S.sel=null;S.trapIdx=(S.trapIdx+1)%TRAPS.length;render();break;
    case 'step':S.step=Number(el.dataset.n);render();break;
    case 'modal':openModal(el.dataset.m,el.dataset.id);break;
    case 'overlay':if(e.target===el)closeModal();break;
    case 'closeModal':closeModal();render();break;
    case 'delSched':S.scheduled=S.scheduled.filter(function(s){return s.id!==el.dataset.id;});persist();render();break;
    case 'delSession':S.sessions=S.sessions.filter(function(s){return s.id!==el.dataset.id;});persist();render();break;
    case 'breath':
      if(S.breathing){stopBreath();}
      else{S.breathing=true;bIdx=0;bTimer=setInterval(function(){bIdx=(bIdx+1)%4;breathUI();},4000);}
      var b=$('#breathBtn');
      if(b){b.className='btn '+(S.breathing?'':'primary');b.innerHTML=S.breathing?ic('pause')+'Stop':ic('play')+'Start breathing';}
      breathUI();break;
    case 'doReset':
      S.xp=INIT.xp;S.streak=INIT.streak;S.hcp=INIT.hcp;S.target=INIT.target;
      S.sessions=JSON.parse(JSON.stringify(INIT.sessions));S.scheduled=JSON.parse(JSON.stringify(INIT.scheduled));S.mental=JSON.parse(JSON.stringify(INIT.mental));
      S.solved={};S.sel=null;persist();closeModal();render();toast('Sample data restored');break;
  }
});

document.addEventListener('input',function(e){
  var r=e.target.getAttribute&&e.target.getAttribute('data-r');if(!r)return;
  var v=Number(e.target.value);
  if(r==='hcp'){
    S.hcp=v;if(S.target>Math.max(0,v-0.5))S.target=Math.max(0,v-0.5);
    var tr=$('#rTgt');if(tr){tr.max=Math.max(0,v-0.5);tr.value=S.target;}
  } else {S.target=v;}
  persist();
  var g=function(id,txt){var n=$(id);if(n)n.textContent=txt;};
  g('#hcpNow',S.hcp.toFixed(1));g('#lHcp',S.hcp.toFixed(1));
  g('#hcpTgt',S.target.toFixed(1));g('#lTgt',S.target.toFixed(1));
  g('#hcpGap',Math.max(0,S.hcp-S.target).toFixed(1));
});

document.addEventListener('submit',function(e){
  var f=e.target;var kind=f.getAttribute('data-form');if(!kind)return;
  e.preventDefault();
  var fd=new FormData(f);
  if(kind==='session'){
    S.sessions.unshift({id:String(Date.now()),date:fd.get('date'),category:String(fd.get('category')).trim(),duration:Number(fd.get('duration')),shotsHit:Number(fd.get('shotsHit')),focusLevel:Number(fd.get('focusLevel')),drills:fd.get('drills'),notes:fd.get('notes'),perceivedQuality:fd.get('perceivedQuality')});
    var sid=fd.get('sched');if(sid)S.scheduled=S.scheduled.filter(function(s){return s.id!==sid;});
    S.xp+=10;persist();closeModal();render();toast('Practice logged. +10 XP');
  } else if(kind==='schedule'){
    S.scheduled.push({id:String(Date.now()),date:fd.get('date'),time:fd.get('time'),category:String(fd.get('category')).trim(),duration:Number(fd.get('duration')),drills:fd.get('drills'),intensity:fd.get('intensity'),targetGoal:fd.get('targetGoal')});
    persist();closeModal();render();toast('Session scheduled');
  } else if(kind==='mental'){
    S.mental.unshift({id:String(Date.now()),date:todayStr(),mood:Number(fd.get('mood')),stress:Number(fd.get('stress')),confidence:Number(fd.get('confidence')),frustration:fd.get('frustration'),reframed:fd.get('reframed')});
    S.xp+=10;persist();closeModal();render();toast('Check-in saved. +10 XP');
  } else if(kind==='booking'){
    S.modal.done=true;paintModal();
  }
});

document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.modal){closeModal();render();}});

function fromHash(){
  var h=(location.hash||'').replace('#','');
  var ok=TABS.some(function(t){return t.id===h;});
  if(ok&&h!==S.tab){stopBreath();S.tab=h;render();window.scrollTo(0,0);}
}
window.addEventListener('hashchange',fromHash);

var h0=(location.hash||'').replace('#','');
if(TABS.some(function(t){return t.id===h0;}))S.tab=h0;
render();
})();
</script>
